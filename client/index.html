<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="title-block">
        <h1>Placement Dashboard</h1>
        <p class="sub">Track placed and unplaced students with quick reports.</p>
      </div>
      <div class="meta">Placement Cell | Demo Module</div>
    </header>

    <section class="panel">
      <aside class="controls">
        <div class="panel-title">Quick Actions</div>
        <button id="btnStats">View Stats</button>
        <button id="btnPlaced">View Placed Students</button>
        <button id="btnUnplaced">View Unplaced Students</button>
        <button id="btnCompany">Company Report</button>
        <button id="btnDept">Department Report</button>
        <div class="hint">Click a button to load data.</div>
      </aside>

      <section class="content">
        <div id="resultTitle" class="result-title">Select a report to view</div>
        <div id="resultBox" class="result-box"></div>
      </section>
    </section>

    <footer class="foot">Data is pulled from MongoDB records.</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
